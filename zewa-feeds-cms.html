        '<div class="igroup"><span class="addon">\u20b9</span><input class="input mono" id="s-rate" value="79"></div></div>' +
      '<div class="field span2"><label class="label" for="s-eta">Estimated delivery text</label>' +
        '<input class="input" id="s-eta" value="Delivered in 3\u20135 working days across India">' +
        '<p class="hint">Shown on the product page and at checkout.</p></div>' +
      '<div class="field span2"><label class="label" for="s-pin">PIN code blacklist</label>' +
        '<textarea class="textarea mono" id="s-pin" style="min-height:70px">744101, 796001, 799001</textarea>' +
        '<p class="hint">Comma-separated. Checkout blocks these PIN codes with a "we do not deliver here yet" message.</p></div>' +
    '</div>';
  } else if (SET_TAB === 1) {
    body = '<div class="form-grid">' +
      '<div class="field"><label class="label" for="s-gst">GST rate</label>' +
        '<div class="igroup"><input class="input has-r mono" id="s-gst" value="18"><span class="addon addon-r">%</span></div></div>' +
      '<div class="field"><label class="label" for="s-gstin">GSTIN</label><input class="input mono" id="s-gstin" value="27AAGCZ1234M1Z5">' +
        '<p class="hint">Printed on every invoice PDF.</p></div>' +
      '<div class="field span2"><label class="switch"><input type="checkbox" checked><span class="track"></span>' +
        '<span><b style="font-size:13px">Prices include GST</b><span class="hint" style="margin:0;display:block">When on, listed prices are tax-inclusive and the invoice shows the tax component broken out.</span></span></label></div>' +
    '</div>';
  } else if (SET_TAB === 2) {
    body = '<div class="form-grid">' +
      '<div class="field span2"><label class="label" for="s-bar">Bar text</label>' +
        '<input class="input" id="s-bar" value="Free shipping on orders above \u20b9999 \u00b7 dispatched same day before 2pm"></div>' +
      '<div class="field"><label class="label" for="s-lbl">Link label</label><input class="input" id="s-lbl" value="Shop now"></div>' +
      '<div class="field"><label class="label" for="s-url">Link URL</label><input class="input mono" id="s-url" value="/shop"></div>' +
      '<div class="field"><label class="label" for="s-bg">Background colour</label>' +
        '<div style="display:flex;gap:8px"><input type="color" value="#080C18" style="width:42px;height:38px;border:1px solid var(--line);border-radius:var(--r);background:none;cursor:pointer">' +
        '<input class="input mono" id="s-bg" value="#080C18"></div></div>' +
      '<div class="field"><label class="label" for="s-fg">Text colour</label>' +
        '<div style="display:flex;gap:8px"><input type="color" value="#44E5C2" style="width:42px;height:38px;border:1px solid var(--line);border-radius:var(--r);background:none;cursor:pointer">' +
        '<input class="input mono" id="s-fg" value="#44E5C2"></div></div>' +
      '<div class="field span2"><label class="label">Preview</label>' +
        '<div style="background:#080C18;color:#44E5C2;padding:9px 14px;border-radius:var(--r);font-size:12.5px;text-align:center">' +
        'Free shipping on orders above \u20b9999 \u00b7 dispatched same day before 2pm &nbsp;<u>Shop now</u></div></div>' +
      '<div class="field span2"><label class="switch"><input type="checkbox" checked><span class="track"></span>' +
        '<span style="font-size:13px"><b>Show the announcement bar</b></span></label></div>' +
    '</div>';
  } else {
    body = '<div class="warnbox" style="margin-bottom:16px">' + svgi(I.alert) +
      '<div><b>Maintenance mode takes the storefront offline for every customer.</b> The CMS stays reachable so you can keep working.</div></div>' +
      '<div class="form-grid">' +
      '<div class="field span2"><label class="switch"><input type="checkbox"><span class="track"></span>' +
        '<span style="font-size:13px"><b>Maintenance mode is off</b></span></label></div>' +
      '<div class="field span2"><label class="label" for="s-msg">Message shown to visitors</label>' +
        '<textarea class="textarea" id="s-msg" style="min-height:70px">We are restocking. The shop reopens shortly \u2014 thank you for your patience.</textarea></div>' +
      '<div class="field"><label class="label" for="s-end">Scheduled end time</label><input class="input" type="datetime-local" id="s-end">' +
        '<p class="hint">Optional. Maintenance mode lifts automatically at this time.</p></div>' +
    '</div>';
  }

  return crumbs([['Dashboard','dashboard'],['Settings','']]) +
    pageHead('Settings', 'Admin only \u00b7 changes are written to the audit log', '') +
    '<div class="tabs">' + tabs.map(function(t,i){
      return '<button class="tab' + (i === SET_TAB ? ' on' : '') + '" data-stab="' + i + '">' + t + '</button>';
    }).join('') + '</div>' +
    '<div class="card"><div class="card-body">' + body + '</div>' +
    '<div class="card-foot"><button class="btn btn-primary" data-act="savesettings">Save changes</button>' +
    '<button class="btn">Discard</button></div></div>';
};
</script>

<script>
/* ==========================================================================
   14. NAVIGATION — order and visibility per spec 3.1
   ========================================================================== */
const NAV = [
  {id:'dashboard', label:'Dashboard', icon:I.dash,   gate:null},
  {id:'products',  label:'Products',  icon:I.box,    gate:'products.view',    subs:[['All Products','products'],['Add Product','product-new']]},
  {id:'orders',    label:'Orders',    icon:I.cart,   gate:'orders.view',      badge:function(){ return ORDERS.filter(function(o){return o.status==='Pending';}).length; },
                                                     subs:[['All Orders','orders'],['Pending','orders'],['Shipped','orders']]},
  {id:'customers', label:'Customers', icon:I.user,   gate:'customers.view',   subs:[['All Customers','customers']]},
  {id:'articles',  label:'Content',   icon:I.pen,    gate:null,               subs:[['Blog Articles','articles'],['Banners','banners'],['Homepage','homepage']]},
  {id:'coupons',   label:'Coupons',   icon:I.ticket, gate:'coupons.edit',     subs:[['All Coupons','coupons'],['Add Coupon','coupon-new']]},
  {id:'reviews',   label:'Reviews',   icon:I.star,   gate:'reviews.moderate', badge:function(){ return REVIEWS.filter(function(r){return r.state==='Pending';}).length; },
                                                     subs:[['Pending','reviews'],['Approved','reviews'],['Rejected','reviews']]},
  {id:'users',     label:'CMS Users', icon:I.users,  gate:'users.manage',     subs:[['All Users','users'],['Add User','users']]},
  {id:'audit',     label:'Audit Log', icon:I.log,    gate:'audit.own'},
  {id:'settings',  label:'Settings',  icon:I.cog,    gate:'settings.manage',  subs:[['Shipping','settings'],['Tax','settings'],['Announcement','settings'],['Maintenance','settings']]}
];

/* which nav item lights up for a given route */
const NAV_OF = {dashboard:'dashboard', products:'products', product:'products', 'product-new':'products',
  orders:'orders', order:'orders', customers:'customers', customer:'customers',
  articles:'articles', banners:'articles', homepage:'articles',
  coupons:'coupons', coupon:'coupons', 'coupon-new':'coupons',
  reviews:'reviews', users:'users', audit:'audit', settings:'settings'};

let ROUTE = {name:'dashboard', arg:null};

function renderNav(){
  $('#navScroll').innerHTML = NAV.filter(function(n){ return !n.gate || can(n.gate); }).map(function(n){
    var active = NAV_OF[ROUTE.name] === n.id;
    var b = n.badge ? n.badge() : 0;
    return '<button class="nav-item' + (active ? ' on open' : '') + '" data-go="' + n.id + '" title="' + n.label + '">' +
      svgi(n.icon) + '<span class="nav-label">' + n.label + '</span>' +
      (b ? '<span class="nav-badge">' + b + '</span>' : (n.subs ? '<span class="nav-caret">' + svgi(I.chev,2.2) + '</span>' : '')) +
      '</button>' +
      (active && n.subs ? '<div class="nav-sub">' + n.subs.map(function(s){
        return '<button data-go="' + s[1] + '" class="' + (s[1] === ROUTE.name ? 'on' : '') + '">' + s[0] + '</button>';
      }).join('') + '</div>' : '');
  }).join('');
}

/* ==========================================================================
   15. ROUTER
   ========================================================================== */
function go(name, arg){
  if (name === 'product-new') { name = 'product'; arg = 'new'; EDIT_TAB = 0; }
  if (name === 'coupon-new')  { name = 'coupon';  arg = 'new'; }
  if (!VIEWS[name]) return;
  ROUTE = {name:name, arg:arg === undefined ? null : arg};
  render();
  $('#nav').classList.remove('open');
  window.scrollTo({top:0});
  $('#view').focus({preventScroll:true});
}

function render(){
  setDirty(false);
  $('#view').innerHTML = VIEWS[ROUTE.name](ROUTE.arg);
  renderNav();
  wireForm();
}

/* ==========================================================================
   16. UNSAVED CHANGES BANNER (spec 3.1)
   ========================================================================== */
let DIRTY = false;
function setDirty(v){
  DIRTY = v;
  $('#unsaved').classList.toggle('show', v);
}
function wireForm(){
  $$('#view input, #view textarea, #view select').forEach(function(el){
    if (el.type === 'date' || el.type === 'datetime-local') return;
    el.addEventListener('input', function(){ if (!el.readOnly) setDirty(true); });
    el.addEventListener('change', function(){ if (!el.readOnly) setDirty(true); });
  });
  /* live character counter, spec 17.3 */
  var short = $('#f-short'), sc = $('#shortCount');
  if (short && sc) {
    var upd = function(){
      sc.textContent = short.value.length;
      sc.style.color = short.value.length > 180 ? 'var(--amber-deep)' : '';
    };
    short.addEventListener('input', upd); upd();
  }
}

/* ==========================================================================
   17. TOASTS (spec 17.1)
   ========================================================================== */
function toast(msg, bad){
  var el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.innerHTML = svgi(bad ? I.alert : I.check, 2.2) + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){ el.remove(); }, 260);
  }, 2600);
}

/* ==========================================================================
   18. MODALS
   ========================================================================== */
function modal(opts){
  $('#modalHost').innerHTML =
    '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><div><div class="modal-title">' + opts.title + '</div>' +
        (opts.sub ? '<div class="modal-sub">' + opts.sub + '</div>' : '') + '</div>' +
        '<button class="modal-x" data-close>' + svgi(I.x,2) + '</button></div>' +
      '<div class="modal-body">' + opts.body + '</div>' +
      '<div class="modal-foot">' + opts.foot + '</div>' +
    '</div>';
  $('#scrim').classList.add('show');
  var f = $('#modalHost input:not([type=checkbox]), #modalHost select, #modalHost textarea');
  if (f) setTimeout(function(){ f.focus(); }, 60);
}
function closeModal(){
  $('#scrim').classList.remove('show');
  setTimeout(function(){ $('#modalHost').innerHTML = ''; }, 200);
}

/* stock quick-update — spec 5.3, the most common daily action */
function stockModal(id){
  var p = PRODUCTS.filter(function(x){ return x.id === id; })[0];
  modal({
    title:'Update stock',
    sub:p.name,
    body:'<div style="padding-bottom:6px">' +
      (p.variants.length > 1
        ? '<div class="field"><label class="label" for="m-sku">SKU</label><select class="select" id="m-sku">' +
          p.variants.map(function(v){ return '<option>' + esc(v.sku) + ' \u2014 ' + esc(v.pack) + ' (' + v.stock + ' in stock)</option>'; }).join('') + '</select></div>'
        : '<div class="rowline" style="margin-bottom:12px"><span class="k">SKU</span><span class="v mono">' + esc(p.variants[0].sku) + '</span></div>') +
      '<div class="field"><label class="label" for="m-stock">New stock count <span class="req">*</span></label>' +
      '<input class="input mono" id="m-stock" value="' + p.stock + '" inputmode="numeric" style="font-size:17px">' +
      '<p class="hint">Current: <span class="mono">' + p.stock + '</span>. Below 10 flags the product as Low Stock; zero emails every Ops Manager and Admin.</p></div>' +
      '</div>',
    foot:'<button class="btn" data-close>Cancel</button>' +
         '<button class="btn btn-primary" data-act="dostock:' + id + '">Update Stock</button>'
  });
}

/* order status — spec 6.3 */
function statusModal(no){
  var o = ORDERS.filter(function(x){ return x.no === no; })[0];
  modal({
    wide:true,
    title:'Update order status',
    sub:o.no + ' \u00b7 ' + o.cust,
    body:'<div class="form-grid" style="padding-bottom:6px">' +
      '<div class="field"><label class="label" for="m-status">New Status <span class="req">*</span></label>' +
        '<select class="select" id="m-status">' + ['Processing','Shipped','Delivered','Cancelled'].map(function(s){
          return '<option' + (s === o.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label class="label" for="m-carrier">Shipping Carrier</label>' +
        '<input class="input" id="m-carrier" value="' + esc(o.carrier) + '" placeholder="DTDC, Blue Dart, India Post"></div>' +
      '<div class="field"><label class="label" for="m-track">Tracking Number <span class="req" id="m-req">*</span></label>' +
        '<input class="input mono" id="m-track" value="' + esc(o.track) + '" placeholder="Required when status is Shipped"></div>' +
      '<div class="field"><label class="label" for="m-url">Tracking URL</label>' +
        '<input class="input" id="m-url" placeholder="Optional \u2014 included in the email"></div>' +
      '<div class="field span2"><label class="label" for="m-note">Internal Note</label>' +
        '<textarea class="textarea" id="m-note" style="min-height:60px" placeholder="Saved to the order. Never sent to the customer."></textarea></div>' +
      '<div class="field span2" style="margin-bottom:8px"><label class="check"><input type="checkbox" checked id="m-notify">' +
        '<span><b>Notify the customer</b><span class="hint" style="margin:0;display:block">Sends a shipping email with the tracking details via ZeptoMail.</span></span></label></div>' +
      (!o.inv ? '<div class="span2 infobox">' + svgi(I.info) + '<div>Moving to <b>Processing</b> reveals the Invoice Number field on the order. The order cannot progress further until that number is entered.</div></div>' : '') +
    '</div>',
    foot:'<button class="btn" data-close>Cancel</button>' +
         '<button class="btn btn-primary" data-act="dostatus:' + no + '">Update Status</button>'
  });
}

/* refund — spec 6.4, Admin only */
function refundModal(no){
  var o = ORDERS.filter(function(x){ return x.no === no; })[0];
  modal({
    title:'Process refund',
    sub:o.no + ' \u00b7 ' + o.cust,
    body:'<div class="warnbox" style="margin-bottom:14px">' + svgi(I.alert) +
      '<div>This sends a real refund through Razorpay against payment <span class="mono">' + esc(o.pid) + '</span>. It cannot be undone from the CMS.</div></div>' +
      '<div class="field"><label class="label" for="m-amt">Refund amount <span class="req">*</span></label>' +
      '<div class="igroup"><span class="addon">\u20b9</span><input class="input mono" id="m-amt" value="' + o.total + '"></div>' +
      '<p class="hint">Pre-filled with the order total. Lower it for a partial refund.</p></div>' +
      '<div class="field"><label class="label" for="m-reason">Reason <span class="req">*</span></label>' +
      '<textarea class="textarea" id="m-reason" style="min-height:64px" placeholder="Recorded in the audit log against your name"></textarea></div>',
    foot:'<button class="btn" data-close>Cancel</button>' +
         '<button class="btn btn-danger" data-act="dorefund:' + no + '">Confirm Refund</button>'
  });
}

/* destructive confirm — spec 17.1: type the name to confirm */
function confirmDelete(kind, name, onOk){
  modal({
    title:'Delete ' + kind,
    sub:'This cannot be undone',
    body:'<div class="warnbox" style="margin-bottom:14px">' + svgi(I.alert) +
      '<div>Deleting <b>' + esc(name) + '</b> removes it permanently. Consider setting it to Inactive instead \u2014 that is reversible.</div></div>' +
      '<div class="field"><label class="label" for="m-confirm">Type <span class="mono">' + esc(name) + '</span> to confirm</label>' +
      '<input class="input mono" id="m-confirm" autocomplete="off"></div>',
    foot:'<button class="btn" data-close>Cancel</button>' +
         '<button class="btn btn-danger" id="m-del" disabled>Delete ' + kind + '</button>'
  });
  var inp = $('#m-confirm'), btn = $('#m-del');
  inp.addEventListener('input', function(){ btn.disabled = inp.value !== name; });
  btn.addEventListener('click', function(){ if (inp.value === name) { closeModal(); onOk(); } });
}

/* add CMS user — spec 11.2 */
function addUserModal(){
  modal({
    title:'Add CMS user',
    sub:'They set their own password and complete 2FA on first login',
    body:'<div class="field"><label class="label" for="m-un">Full Name <span class="req">*</span></label><input class="input" id="m-un"></div>' +
      '<div class="field"><label class="label" for="m-ue">Email Address <span class="req">*</span></label><input class="input" id="m-ue" type="email" placeholder="name@zewafeeds.com">' +
      '<p class="hint">This becomes their login. Must be unique.</p></div>' +
      '<div class="field"><label class="label" for="m-ur">Role <span class="req">*</span></label><select class="select" id="m-ur">' +
      '<option>Content Editor</option><option>Ops Manager</option><option>Admin</option></select></div>' +
      '<div class="field"><label class="check"><input type="checkbox" checked>' +
      '<span><b>Send invite email</b><span class="hint" style="margin:0;display:block">Sends a "Set your password" link. 2FA setup is forced before they reach any module.</span></span></label></div>',
    foot:'<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-act="douser">Send invite</button>'
  });
}

/* full review — spec 9 */
function reviewModal(id){
  var r = REVIEWS.filter(function(x){ return x.id === id; })[0];
  modal({
    wide:true,
    title:r.prod,
    sub:r.cust + ' \u00b7 ' + r.at,
    body:'<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">' + stars(r.rating) +
      (r.vp ? pill('p-green','Verified purchase') : pill('p-grey','Not a verified purchase')) +
      pill(r.state === 'Approved' ? 'p-green' : r.state === 'Pending' ? 'p-amber' : 'p-red', r.state) + '</div>' +
      '<p style="font-size:13.5px;line-height:1.65;padding:12px;background:var(--canvas);border-radius:var(--r)">' + esc(r.body) + '</p>',
    foot:'<button class="btn" data-close>Close</button>' +
      (r.state !== 'Rejected' ? '<button class="btn btn-danger" data-act="reject:' + r.id + '">Reject</button>' : '') +
      (r.state !== 'Approved' ? '<button class="btn btn-primary" data-act="approve:' + r.id + '">Approve</button>' : '')
  });
}

/* ==========================================================================
   19. ACTION DISPATCH
   ========================================================================== */
function act(key){
  var bits = key.split(':');
  var cmd = bits[0], arg = bits.slice(1).join(':');

  switch (cmd) {
    case 'toast':    toast(arg); break;
    case 'product':  EDIT_TAB = 0; go('product', Number(arg)); break;
    case 'order':    go('order', arg); break;
    case 'customer': go('customer', arg); break;
    case 'coupon':   go('coupon', arg); break;
    case 'reviews':  go('reviews'); break;
    case 'coupons':  go('coupons'); break;
    case 'articles': go('articles'); break;

    case 'stock':    stockModal(Number(arg)); break;
    case 'dostock': {
      var p = PRODUCTS.filter(function(x){ return x.id === Number(arg); })[0];
      var v = parseInt($('#m-stock').value, 10);
      if (isNaN(v) || v < 0) { toast('Enter a whole number of units', true); return; }
      var was = p.stock;
      p.stock = v;
      p.variants[0].stock = v;
      p.upd = '24 Jul 2026'; p.by = ROLES[ROLE].person;
      closeModal(); render();
      toast('Stock updated: ' + was + ' \u2192 ' + v);
      break;
    }

    case 'status':   statusModal(arg); break;
    case 'dostatus': {
      var o = ORDERS.filter(function(x){ return x.no === arg; })[0];
      var ns = $('#m-status').value, tn = $('#m-track').value.trim();
      if (ns === 'Shipped' && !tn) {
        $('#m-track').classList.add('bad');
        if (!$('#m-track').nextElementSibling || !$('#m-track').nextElementSibling.classList.contains('err'))
          $('#m-track').insertAdjacentHTML('afterend', '<div class="err">' + svgi(I.alert,2) + 'Tracking number is required when the status is Shipped</div>');
        toast('Tracking number is required for Shipped', true);
        return;
      }
      if (ns !== 'Pending' && ns !== 'Processing' && !o.inv) {
        toast('Enter the invoice number before moving past Processing', true);
        return;
      }
      o.status = ns; o.track = tn; o.carrier = $('#m-carrier').value.trim();
      closeModal(); render();
      toast('Order ' + o.no + ' is now ' + ns + ($('#m-notify') && $('#m-notify').checked ? ' \u00b7 customer emailed' : ''));
      break;
    }

    case 'refund':   refundModal(arg); break;
    case 'dorefund': {
      var ro = ORDERS.filter(function(x){ return x.no === arg; })[0];
      if (!$('#m-reason').value.trim()) { toast('A reason is required for every refund', true); return; }
      ro.pay = 'Refunded'; ro.status = 'Cancelled';
      closeModal(); render();
      toast('Refund sent to Razorpay \u00b7 logged against ' + ROLES[ROLE].person);
      break;
    }

    case 'review':   reviewModal(Number(arg)); break;
    case 'approve': {
      REVIEWS.filter(function(x){ return x.id === Number(arg); })[0].state = 'Approved';
      closeModal(); render(); toast('Review approved and live on the product page');
      break;
    }
    case 'reject': {
      REVIEWS.filter(function(x){ return x.id === Number(arg); })[0].state = 'Rejected';
      closeModal(); render(); toast('Review rejected and archived');
      break;
    }
    case 'approveall': {
      var n = 0;
      REVIEWS.forEach(function(r){ if (r.state === 'Pending') { r.state = 'Approved'; n++; } });
      render(); toast(n + ' reviews approved');
      break;
    }

    case 'ban': {
      var c = CUSTOMERS.filter(function(x){ return x.name === arg; })[0];
      if (c.status === 'Active') {
        modal({
          title:'Ban ' + c.name + '?',
          sub:'Reversible at any time',
          body:'<div class="warnbox">' + svgi(I.alert) + '<div>They will be signed out immediately and see <i>"Your account has been suspended"</i> when they try to log in. Their order history stays intact.</div></div>',
          foot:'<button class="btn" data-close>Cancel</button><button class="btn btn-danger" data-act="doban:' + arg + '">Ban customer</button>'
        });
      } else { c.status = 'Active'; render(); toast(c.name + ' can sign in again'); }
      break;
    }
    case 'doban': {
      CUSTOMERS.filter(function(x){ return x.name === arg; })[0].status = 'Banned';
      closeModal(); render(); toast(arg + ' has been banned');
      break;
    }

    case 'savedraft':  setDirty(false); toast('Draft saved \u00b7 the live site is unchanged'); break;
    case 'preview':    toast('Preview opened in a new tab with the draft data'); break;
    case 'publish': {
      var pp = PRODUCTS.filter(function(x){ return x.id === Number(arg); })[0];
      if (pp && !pp.variants.length) { toast('Add at least one SKU before publishing', true); return; }
      if (pp) { pp.draft = false; if (pp.status === 'Draft') pp.status = 'Active'; }
      setDirty(false); render(); toast('Published \u00b7 live on the storefront now');
      break;
    }
    case 'viewsite':   toast('Opening the product page on zewafeeds.com'); break;
    case 'savecoupon': setDirty(false); toast('Coupon saved'); break;
    case 'savesettings': setDirty(false); toast('Settings saved'); break;

    case 'adduser':    addUserModal(); break;
    case 'douser': {
      var nm = $('#m-un').value.trim(), em = $('#m-ue').value.trim();
      if (!nm || !em) { toast('Name and email are both required', true); return; }
      CMS_USERS.push({name:nm, email:em, role:$('#m-ur').value, last:'\u2014 never', status:'Active', twofa:'Pending setup'});
      closeModal(); render(); toast('Invite sent to ' + em);
      break;
    }
    case 'deact': {
      var u = CMS_USERS.filter(function(x){ return x.name === arg; })[0];
      u.status = u.status === 'Active' ? 'Deactivated' : 'Active';
      render();
      toast(u.status === 'Active' ? arg + ' reactivated' : arg + ' deactivated \u00b7 all sessions ended');
      break;
    }

    case 'deluser':   confirmDelete('user', arg, function(){
      CMS_USERS.splice(CMS_USERS.findIndex(function(x){ return x.name === arg; }), 1);
      render(); toast(arg + ' deleted \u00b7 their audit entries remain');
    }); break;
    case 'delcoupon': confirmDelete('coupon', arg, function(){
      COUPONS.splice(COUPONS.findIndex(function(x){ return x.code === arg; }), 1);
      go('coupons'); toast('Coupon ' + arg + ' deleted');
    }); break;
    case 'delarticle': confirmDelete('article', arg, function(){ toast('Article deleted'); }); break;
    case 'delsku':     confirmDelete('SKU', arg, function(){ toast('SKU ' + arg + ' deleted'); }); break;
  }
}

/* ==========================================================================
   20. EVENTS
   ========================================================================== */
document.addEventListener('click', function(e){
  var t = e.target;

  if (t.closest('[data-close]')) { closeModal(); return; }
  var s = t.closest('[data-stock]');if (s) { e.preventDefault(); e.stopPropagation(); stockModal(Number(s.dataset.stock)); return; }
  var a = t.closest('[data-act]');  if (a) { e.preventDefault(); act(a.dataset.act); return; }
  var g = t.closest('[data-go]');   if (g) { e.preventDefault(); go(g.dataset.go); return; }

  var et = t.closest('[data-etab]'); if (et) { EDIT_TAB = Number(et.dataset.etab); render(); return; }
  var st = t.closest('[data-stab]'); if (st) { SET_TAB  = Number(st.dataset.stab); render(); return; }
  var rt = t.closest('[data-rtab]'); if (rt) { REV_TAB  = rt.dataset.rtab;         render(); return; }

  var tab = t.closest('[data-tab]');
  if (tab) { tab.parentElement.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); }); tab.classList.add('on'); return; }

  var sortTh = t.closest('th.sortable');
  if (sortTh) {
    sortTh.parentElement.querySelectorAll('th').forEach(function(x){ x.classList.remove('sorted'); });
    sortTh.classList.add('sorted');
    return;
  }

  /* menus */
  if (t.closest('#roleBtn')) { $('#roleMenu').classList.toggle('show'); $('#userMenu').classList.remove('show'); return; }
  if (t.closest('#userBtn')) { $('#userMenu').classList.toggle('show'); $('#roleMenu').classList.remove('show'); return; }
  if (!t.closest('.menu')) { $('#roleMenu').classList.remove('show'); $('#userMenu').classList.remove('show'); }
  if (!t.closest('.gsearch')) $('#gsResults').classList.remove('show');
  if (t.closest('#scrim') && !t.closest('.modal')) closeModal();
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') {
    closeModal();
    $('#roleMenu').classList.remove('show');
    $('#userMenu').classList.remove('show');
    $('#gsResults').classList.remove('show');
    $('#nav').classList.remove('open');
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); $('#gsInput').focus(); }
});

/* sidebar collapse + mobile */
$('#collapseBtn').addEventListener('click', function(){ $('#app').classList.toggle('mini'); });
$('#menuBtn').addEventListener('click', function(){ $('#nav').classList.toggle('open'); });

/* unsaved banner */
$('#saveBtn').addEventListener('click', function(){ setDirty(false); toast('Changes saved'); });
$('#discardBtn').addEventListener('click', function(){ render(); toast('Changes discarded'); });

/* ==========================================================================
   21. ROLE SWITCHING (demos the RBAC matrix, spec 2.1)
   ========================================================================== */
function paintRole(){
  var r = ROLES[ROLE];
  $('#roleDot').style.background = r.dot;
  $('#roleLabel').textContent = r.name;
  $('#userAv').textContent = r.av;
  $('#roleMenu').innerHTML = '<div class="mhead">Preview the CMS as</div>' +
    Object.keys(ROLES).map(function(k){
      return '<button data-role="' + k + '">' +
        '<span style="width:8px;height:8px;border-radius:50%;background:' + ROLES[k].dot + ';flex:none"></span>' +
        '<span><b>' + ROLES[k].name + '</b><span style="display:block;font-size:11.5px;color:var(--muted)">' + ROLES[k].who + '</span></span>' +
        (k === ROLE ? '<span style="margin-left:auto;color:var(--teal-deep)">' + svgi(I.check,2.4) + '</span>' : '') +
        '</button>';
    }).join('');
  $('#userMenu').innerHTML =
    '<div class="mhead"><b style="color:var(--text)">' + r.person + '</b><br>' + r.name + '</div><hr>' +
    '<button data-act="toast:Profile page opens here">' + svgi(I.user) + 'My Profile</button>' +
    '<button data-act="toast:Change password flow opens here">' + svgi(I.key) + 'Change Password</button><hr>' +
    '<button data-act="toast:Signed out" style="color:var(--red-deep)">' + svgi(I.out) + 'Sign Out</button>';
}

$('#roleMenu').addEventListener('click', function(e){
  var b = e.target.closest('[data-role]');
  if (!b) return;
  ROLE = b.dataset.role;
  paintRole();
  $('#roleMenu').classList.remove('show');
  var allowed = NAV.filter(function(n){ return !n.gate || can(n.gate); }).map(function(n){ return n.id; });
  var home = NAV_OF[ROUTE.name];
  if (allowed.indexOf(home) === -1) go('dashboard'); else render();
  toast('Now previewing as ' + ROLES[ROLE].name);
});

/* ==========================================================================
   22. GLOBAL SEARCH — orders + customers + products at once (spec 3.1)
   ========================================================================== */
$('#gsInput').addEventListener('input', function(){
  var q = this.value.trim().toLowerCase();
  var box = $('#gsResults');
  if (q.length < 2) { box.classList.remove('show'); return; }

  var out = '';
  if (can('orders.view')) {
    var os = ORDERS.filter(function(o){
      return (o.no + ' ' + o.cust + ' ' + o.email).toLowerCase().indexOf(q) > -1; }).slice(0,3);
    if (os.length) out += '<div class="gs-group">Orders</div>' + os.map(function(o){
      return '<div class="gs-row" data-act="order:' + o.no + '">' + svgi(I.cart).replace('<svg','<svg style="width:15px;height:15px;color:var(--muted-2);flex:none"') +
        '<span>' + esc(o.cust) + '</span><span class="mono">' + esc(o.no) + '</span></div>'; }).join('');
  }
  if (can('customers.view')) {
    var cs = CUSTOMERS.filter(function(c){
      return (c.name + ' ' + c.email).toLowerCase().indexOf(q) > -1; }).slice(0,3);
    if (cs.length) out += '<div class="gs-group">Customers</div>' + cs.map(function(c){
      return '<div class="gs-row" data-act="customer:' + esc(c.name) + '">' + svgi(I.user).replace('<svg','<svg style="width:15px;height:15px;color:var(--muted-2);flex:none"') +
        '<span>' + esc(c.name) + '</span><span class="mono">' + esc(c.email) + '</span></div>'; }).join('');
  }
  if (can('products.view')) {
    var ps = PRODUCTS.filter(function(p){
      return (p.name + ' ' + p.variants.map(function(v){ return v.sku; }).join(' ')).toLowerCase().indexOf(q) > -1; }).slice(0,4);
    if (ps.length) out += '<div class="gs-group">Products</div>' + ps.map(function(p){
      return '<div class="gs-row" data-act="product:' + p.id + '">' + svgi(I.box).replace('<svg','<svg style="width:15px;height:15px;color:var(--muted-2);flex:none"') +
        '<span>' + esc(p.name) + '</span><span class="mono">' + esc(p.variants[0].sku) + '</span></div>'; }).join('');
  }

  box.innerHTML = out || '<div class="gs-row" style="color:var(--muted);cursor:default">No matches for "' + esc(q) + '"</div>';
  box.classList.add('show');
});

/* ==========================================================================
   23. BOOT
   ========================================================================== */
paintRole();
go('dashboard');
</script>
